<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#17131c">
  <title>새벽 2시, 우주 분식</title>
  <style>
    :root{--cream:#fff0d2;--muted:#c8bcae;--orange:#ffb36b;--pink:#f28b9b;--panel:#211d27;--line:#ffffff24}
    *{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--cream);background:radial-gradient(ellipse at 80% 8%,#594253 0,#282331 36%,#15151d 80%);font-family:Georgia,"Noto Serif KR",serif}
    .wrap{max-width:1080px;margin:auto;padding:24px 30px 48px}.top{display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);padding:0 0 16px;color:#d4c5b3;font:12px Arial,sans-serif;letter-spacing:.14em}.top a{color:var(--orange);text-decoration:none;letter-spacing:0}
    .hero{display:grid;grid-template-columns:1.1fr .9fr;gap:30px;align-items:center;padding:48px 0 36px}.eyebrow{color:var(--orange);font:11px Arial,sans-serif;letter-spacing:.24em}.hero h1{font-size:clamp(42px,6vw,68px);line-height:1.13;font-weight:400;letter-spacing:-.05em;margin:14px 0}.hero p{max-width:490px;color:var(--muted);line-height:1.9;font-size:15px}.badge{display:inline-block;border:1px solid #ffb36b66;color:#ffd093;padding:7px 11px;margin-top:8px;font:11px Arial,sans-serif;letter-spacing:.07em}
    .illustration{height:255px;display:grid;place-items:center;position:relative;border:1px solid #ffffff16;border-radius:6px;overflow:hidden;background:radial-gradient(circle at 50% 55%,#bb6f4b55,transparent 44%),linear-gradient(145deg,#302b39,#181922)}.illustration:before,.illustration:after{content:"";position:absolute;border:1px solid #fff2;border-radius:50%;width:220px;height:220px}.illustration:after{width:290px;height:290px;border-color:#ffcf7c1a}.moon{position:absolute;right:32px;top:22px;font-size:46px;color:#ffe6ad}.bowl{position:relative;z-index:1;font-size:105px;filter:drop-shadow(0 12px 16px #0008);transform:rotate(-8deg)}.orbit{position:absolute;top:31px;left:44px;color:#ffcb87;font-size:25px}.orbit.two{top:auto;left:auto;right:78px;bottom:38px;color:#f092a1;font-size:18px}
    .scene-art{height:clamp(190px,30vw,270px);margin:0 0 24px;border:1px solid #ffffff20;border-radius:4px;overflow:hidden;background:#191922;box-shadow:0 12px 36px #0005}.scene-art svg{display:block;width:100%;height:100%}
    .layout{display:grid;grid-template-columns:minmax(0,1fr) 245px;gap:34px}.card{border:1px solid var(--line);background:linear-gradient(135deg,#211d27ee,#191922f2);padding:clamp(24px,4vw,42px);min-height:375px;box-shadow:0 22px 65px #0003}.chapter{color:var(--orange);font:11px Arial,sans-serif;letter-spacing:.2em}.title{font-size:30px;font-weight:400;margin:10px 0 20px}.story{white-space:pre-line;font-size:17px;line-height:2;min-height:180px;color:#eee3d4}.choices{margin-top:22px}.choice{width:100%;text-align:left;margin:7px 0;padding:14px 16px;border:1px solid #ffffff30;background:#ffffff08;color:var(--cream);font:15px Georgia,"Noto Serif KR",serif;cursor:pointer;transition:background .2s,border-color .2s,transform .2s}.choice:hover{background:#ffb36b12;border-color:var(--orange);transform:translateX(3px)}.choice:focus-visible,button:focus-visible,a:focus-visible{outline:2px solid var(--orange);outline-offset:3px}.aside{border-left:1px solid var(--line);padding-left:20px}.aside h2{font:11px Arial,sans-serif;color:var(--orange);letter-spacing:.16em;margin:4px 0 10px}.stamp-count{font-size:12px;color:var(--muted);margin-bottom:14px}.stamp{border-top:1px solid var(--line);padding:11px 0;color:#9b928c;font-size:13px}.stamp.got{color:#ffe2a1}.bad-list{margin-bottom:24px}.bad-entry{border-top:1px solid var(--line);padding:10px 0;color:#a59b97}.bad-entry.found{color:#ffd9c4}.bad-title{font:12px/1.5 Georgia,"Noto Serif KR",serif}.bad-hint{margin-top:3px;color:#8f8585;font:10px/1.5 Arial,sans-serif}.bad-entry.found .bad-hint{color:#c3a9a0}.side-note{margin-top:28px;color:#968e8b;font:12px/1.8 Arial,sans-serif}.restart{margin-top:17px;padding:10px 14px;border:1px solid #ffffff38;background:transparent;color:#d7cabb;font:12px Arial,sans-serif;cursor:pointer}.restart:hover{border-color:var(--orange);color:var(--cream)}.gameover{color:var(--pink);font:11px Arial,sans-serif;letter-spacing:.2em}.ending h2{font-size:35px;font-weight:400;margin:12px 0}.ending .story{min-height:0}.ending .choice{margin-top:23px;text-align:center;background:#ffb36b;color:#211922;border-color:#ffb36b;font-weight:bold}
    footer{border-top:1px solid var(--line);margin-top:46px;padding-top:18px;display:flex;justify-content:space-between;color:#898188;font:11px Arial,sans-serif}footer a{color:#b8a995;text-decoration:none}
    @media(max-width:760px){.wrap{padding:18px 20px 34px}.hero{grid-template-columns:1fr;padding-top:38px;gap:20px}.illustration{height:190px}.bowl{font-size:82px}.layout{grid-template-columns:1fr;gap:24px}.aside{border:0;border-top:1px solid var(--line);padding:20px 0 0}.aside h2{margin-top:0}.stamp-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}.stamp{line-height:1.5}.side-note{margin-top:14px}.card{min-height:0}}
  </style>
</head>
<body>
  <main class="wrap">
    <header class="top"><span>✦　밤의 서가 · 이야기 002</span><a href="./index.html">← 이야기 서가</a></header>
    <section class="hero" aria-labelledby="game-name">
      <div><div class="eyebrow">THE LAST ORDER IN THE GALAXY</div><h1 id="game-name">새벽 2시,<br>우주 분식</h1><p>은하 끝 분식집의 마지막 야간 근무. 손님 셋의 주문을 무사히 해결하고 셔터를 내릴 수 있을까? 우주에서는 상식보다 눈치가 중요하다.</p><span class="badge">기괴함　✦　황당함　✦　게임 오버 있음</span></div>
      <div class="illustration" aria-hidden="true"><span class="moon">☾</span><span class="orbit">✦</span><span class="bowl">🍜</span><span class="orbit two">✧</span></div>
    </section>
    <div class="layout">
      <section class="card" aria-live="polite" aria-atomic="true">
        <figure class="scene-art" id="sceneArt" aria-label="장면 삽화"></figure><div class="chapter" id="chapter"></div><h2 class="title" id="title"></h2><div class="story" id="story"></div><div class="choices" id="choices"></div>
      </section>
      <aside class="aside"><h2>오늘 밤의 주문 도장</h2><div class="stamp-count" id="stampCount"></div><div class="stamp-list" id="stamps"></div><h2>게임 오버 도감</h2><div class="stamp-count" id="badCount"></div><div class="bad-list" id="badEndings"></div><div class="side-note">손님은 메뉴판에 적힌 것과 다른 걸 원할지도 모른다. 일단 이야기를 들어보자.</div><button class="restart" id="restart" type="button">근무 다시 시작</button></aside>
    </div>
    <footer><span>은하 분식 · 심야 영업 중</span><a href="./index.html">밤의 서가로 돌아가기</a></footer>
  </main>
  <script>
    const stampNames=[['moon','달토끼의 도장'],['fish','미래 금붕어의 도장'],['tteok','떡볶이의 도장']];
    let earned=[],badEndingsSeen=[];
    const badEndingCatalog=[['over_moon_soft','달토끼의 턱이 퇴근했다','달토끼의 떡볶이를 너무 오래 끓여 보면…'],['over_moon_send','달에 반품 접수','달토끼를 그냥 돌려보내면…'],['over_fish_water','금붕어가 미래를 들이마셨다','미래 금붕어에게 수돗물을 권하면…'],['over_fish_fridge','냉장고에서 208년 뒤','손님을 냉장고에 넣어 시원하게 하면…'],['over_tteok_pot','노동조합, 냄비 안에서 결성','말하는 떡의 요구를 냄비로 해결하면…'],['over_tteok_eat','오늘의 추천 메뉴가 사장님','계약직 떡을 오늘의 메뉴로 만들면…'],['over_rating','별점 다섯 개가 너무 무거웠다','마지막 리뷰를 혼자 별 다섯 개로 채우면…']];
    try{const saved=JSON.parse(localStorage.getItem('spaceBunsikBadEndings')||'[]');if(Array.isArray(saved))badEndingsSeen=saved.filter(id=>badEndingCatalog.some(([key])=>key===id))}catch(e){}
    const scenes={
      start:{chapter:'근무 시작 · 02:00',title:'셔터가 혼자 올라갔다',text:'은하 분식의 야간 알바 첫날. 우주 정거장 한복판인데 가게 안에는 지구 중력만 적용된다. 사장님은 앞치마를 건네며 당부했다.\n\n“오늘은 손님 셋만 받고 문 닫아. 메뉴판에 없는 주문은 절대 받지 말고.”\n\n그 순간, 주문 벨이 스스로 울렸다. 메뉴판에는 없는 손님 그림자가 문 아래로 길게 들어온다.',choices:[['첫 손님을 맞이한다','moon'],['사장님에게 규칙을 다시 묻는다','rule']]},
      rule:{chapter:'근무 시작 · 주의사항',title:'메뉴판 뒷면',text:'메뉴판 뒷면에는 사장님의 글씨로 규칙이 적혀 있다.\n\n1. 손님이 “안 씹히는 떡볶이”를 주문하면 그림을 그려줄 것.\n2. 금붕어에게 물을 권하지 말 것. 금붕어는 미래에서 왔다.\n3. 떡볶이가 말을 걸면 먼저 퇴근 시간을 물어볼 것.\n\n세 번째 규칙 밑에는 누군가 연필로 “말 걸기 전에 튀기지 마”라고 덧붙였다.',choices:[['규칙을 기억하고 문을 연다','moon']]},
      moon:{chapter:'첫 번째 손님 · 달토끼',title:'안 씹히는 떡볶이',text:'우주복을 입은 달토끼가 의자에 앉는다. 헬멧 안쪽에 작은 달이 하나 더 떠 있다.\n\n“이가 빠졌어요. 안 씹히는 떡볶이를 주세요. 매운맛은 초승달 정도로요.”\n\n토끼는 메뉴판을 거꾸로 들고 진지하게 고개를 끄덕인다.',choices:[['떡볶이 그림을 그려 소스 향만 살짝 뿌린다','fish','moon'],['떡볶이를 아주 오래 끓여 흐물흐물하게 만든다','over_moon_soft'],['“이가 다시 날 때 오세요”라며 돌려보낸다','over_moon_send']]},
      fish:{chapter:'두 번째 손님 · 미래 금붕어',title:'추억 맛 탄산수',text:'어항을 든 금붕어가 계산대 위로 올라온다. 어항에는 물 대신 작은 별들이 둥둥 떠다닌다.\n\n“저는 208살의 미래에서 왔어요. 고향 바다가 그리운데, 바닷물은 너무 과거의 맛이라서요.”\n\n금붕어가 지느러미로 메뉴판을 넘긴다. 종이에서 파도 소리가 난다.',choices:[['탄산수 컵에 바다를 그려주고, 빨대는 아주 길게 꽂는다','tteok','fish'],['수돗물을 어항에 콸콸 붓는다','over_fish_water'],['어항을 냉장고에 넣어 시원하게 해준다','over_fish_fridge']]},
      tteok:{chapter:'세 번째 손님 · 자아가 생긴 떡볶이',title:'떡의 노동권',text:'주방에서 냄비 뚜껑이 달그락거린다. 떡 하나가 젓가락을 타고 나와 계산대에 선다. 명찰에는 “김떡, 계약직”이라고 적혀 있다.\n\n“저희도 계속 끓기만 할 순 없어요. 오늘은 퇴근 시간을 정하고 싶습니다.”\n\n뒤쪽 냄비에서 다른 떡들이 조용히 웅성댄다.',choices:[['근무표에 퇴근 시간을 적고 떡들의 대표 도장을 받는다','final','tteok'],['떡을 다시 냄비에 넣고 뚜껑을 닫는다','over_tteok_pot'],['김떡을 오늘의 추천 메뉴로 먹어버린다','over_tteok_eat']]},
      final:{chapter:'폐점 직전 · 마지막 주문',title:'은하 배달앱의 별점',text:'세 손님이 각자의 도장을 계산대에 놓는다. 주문 전표가 저절로 합쳐져 작은 로켓 모양이 된다.\n\n그때 배달앱 알림이 뜬다. “가게를 평가해 주세요. 별점이 낮으면 이 지점을 블랙홀로 이전합니다.”\n\n사장님은 이미 퇴근했고, 별점 입력창에는 선택지가 둘뿐이다.',choices:[['손님들과 떡들이 직접 오늘의 별점을 정하게 한다','win'],['별 다섯 개를 전부 혼자 입력한다','over_rating']]},
      over_moon_soft:{chapter:'GAME OVER · 첫 번째 주문',title:'달토끼의 턱이 퇴근했다',text:'떡볶이는 입에 넣기도 전에 흐물흐물 사라졌다. 달토끼는 숟가락으로 국물을 떠먹으며 말했다.\n\n“이건 안 씹히는 게 아니라, 존재하지 않는 맛이네요.”\n\n너무 실망한 토끼는 달의 뒷면으로 귀가했다. 가게에는 달토끼 모양의 빈 의자만 남았다. 주문 하나를 놓치자 오늘의 셔터는 영영 내려오지 않았다.',over:true},
      over_moon_send:{chapter:'GAME OVER · 첫 번째 주문',title:'달에 반품 접수',text:'달토끼가 조용히 일어나 헬멧을 닫았다. “이가 다시 나면 우주 전체가 먼저 알겠죠.”\n\n토끼가 떠난 뒤, 메뉴판에 새 항목이 생겼다. <반품: 친절하지 않은 사장님> 별점은 별 하나였다.',over:true},
      over_fish_water:{chapter:'GAME OVER · 두 번째 주문',title:'금붕어가 미래를 들이마셨다',text:'금붕어는 수돗물을 한 모금 마시더니 잠깐 미래를 봤다. 미래의 자신이 아주 큰 수건에 싸여 있었다.\n\n“역시 물은 너무 옛날 맛이야.” 금붕어는 어항과 함께 물속으로 헤엄쳐 사라졌다. 바닥에는 젖은 시간표만 남았다.',over:true},
      over_fish_fridge:{chapter:'GAME OVER · 두 번째 주문',title:'냉장고에서 208년 뒤',text:'냉장고 문을 열자 금붕어는 한층 더 미래에 도착해 있었다. 208년 뒤의 금붕어는 이미 따뜻한 탄산수를 싫어했다.\n\n가게 시계는 혼자 다음 세기를 가리켰다. 사장님이 냉장고에 붙여둔 쪽지가 보인다. “손님을 가전제품에 넣지 말 것.”',over:true},
      over_tteok_pot:{chapter:'GAME OVER · 세 번째 주문',title:'노동조합, 냄비 안에서 결성',text:'뚜껑을 닫자 냄비 안에서 구호가 들렸다. “떡도 쉬고 싶다! 떡도 쉬고 싶다!”\n\n냄비가 스스로 파업에 들어가 주방을 떠났다. 우주 분식은 그날부터 영업을 무기한 중단했다. 떡볶이 국물 한 방울이 계산대에 사직서를 제출했다.',over:true},
      over_tteok_eat:{chapter:'GAME OVER · 세 번째 주문',title:'오늘의 추천 메뉴가 사장님',text:'김떡은 먹히기 직전에도 침착하게 계약서를 내밀었다. 계약서에는 “먹힌 뒤에도 초과근무 수당 지급”이라고 적혀 있었다.\n\n그날 이후 가게 메뉴판에는 새 메뉴가 생겼다. <사장님 볶음>. 아무도 주문하지 않았지만, 메뉴가 스스로 별점 하나를 남겼다.',over:true},
      over_rating:{chapter:'GAME OVER · 최종 평가',title:'별점 다섯 개가 너무 무거웠다',text:'별 다섯 개를 혼자 입력하는 순간, 별점이 진짜 별이 되어 천장에서 떨어졌다. 가게는 별 다섯 개에 깔려 납작한 리뷰 한 장이 되었다.\n\n마지막으로 들린 소리는 배달앱의 안내였다. “사장님, 리뷰는 나누어 쓰셔도 됩니다.”',over:true},
      win:{chapter:'ENDING · 폐점 성공',title:'은하에서 가장 말랑한 밤',text:'손님과 떡들은 서로의 별점을 나눠 적었다. 달토끼는 별 다섯 개 중 네 개를 주고, 나머지 한 개는 달에 남겨두었다. 금붕어는 탄산수 컵의 그림을 고향 바다에 전송했다. 김떡은 주 4일 근무 계약서에 사인했다.\n\n배달앱은 감동해 가게를 “은하의 숨은 맛집”으로 등록했다. 사장님은 다음 날 아침, 로켓 모양의 퇴직금을 보내왔다.\n\n셔터가 내려갔다. 우주 분식의 첫 야간 근무는 무사히 끝났다.',ending:true}
    };
    const chapter=document.getElementById('chapter'),title=document.getElementById('title'),story=document.getElementById('story'),choices=document.getElementById('choices'),stamps=document.getElementById('stamps'),stampCount=document.getElementById('stampCount'),badCount=document.getElementById('badCount'),badEndings=document.getElementById('badEndings');
    function renderStamps(){stampCount.textContent=earned.length+' / 3 주문 완료';stamps.replaceChildren(...stampNames.map(([id,name])=>{const item=document.createElement('div');item.className='stamp'+(earned.includes(id)?' got':'');item.textContent=(earned.includes(id)?'✦　':'○　')+name;return item}))}
