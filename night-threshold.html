<!doctype html><html lang="ko"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>밤의 문턱</title><style>body{background:radial-gradient(ellipse at 80% 10%,#573343,#101219 60%);color:#eee8de;margin:0;font-family:Georgia,serif}.wrap{max-width:850px;margin:auto;padding:30px}.top{display:flex;justify-content:space-between;align-items:center;color:#d4b77d;border-bottom:1px solid #555;padding:0 0 18px;font:12px sans-serif;letter-spacing:3px}.top-right{display:flex;align-items:center;gap:18px}.home-link{color:#eee8de;text-decoration:none;border:1px solid #ffffff33;padding:8px 11px;font:12px sans-serif;letter-spacing:0}.home-link:hover{border-color:#d4b77d;color:#d4b77d}.cols{display:grid;grid-template-columns:1fr 200px;gap:50px;padding-top:60px}.tag{color:#d4b77d;font:11px sans-serif;letter-spacing:3px}.title{font-size:54px}.scene-art{margin:24px 0 26px;border:1px solid #ffffff24;border-radius:4px;overflow:hidden;background:#15151c;box-shadow:0 18px 55px #0008}.scene-art svg{display:block;width:100%;height:auto;aspect-ratio:2.35}.story{white-space:pre-line;line-height:2;font-size:18px;min-height:240px}.button{display:block;width:100%;padding:16px;margin:12px 0;background:#ffffff0c;color:#eee;border:1px solid #ffffff33;text-align:left;font:16px Georgia;cursor:pointer}.button:hover{border-color:#d4b77d}.side{border-left:1px solid #555;padding-left:20px;color:#d4b77d;font:12px sans-serif}.clue{color:#ddd;border-top:1px solid #444;padding:12px 0;font:14px Georgia}.ending-head{margin-top:30px;color:#d4b77d}.ending-entry{color:#bbb;border-top:1px solid #444;padding:10px 0;font:13px Georgia}.ending-entry.found{color:#eee8de}.ending-count{color:#d4b77d;font:12px sans-serif;margin:8px 0}.reset{background:none;border:0;color:#bbb;text-decoration:underline;cursor:pointer}.meter{margin-top:30px;color:#888}#bar{height:2px;background:#9b5260;width:0;margin-top:8px}@media(max-width:650px){.cols{grid-template-columns:1fr;gap:25px;padding-top:35px}.side{border:0;border-top:1px solid #555;padding:20px 0}.title{font-size:42px}.story{min-height:0}.top{letter-spacing:1px}.top-right{gap:8px}.home-link{padding:7px 8px;font-size:11px}}
</style><main class="wrap"><div class="top"><span>✦　밤의 문턱</span><span class="top-right"><span id="chapter"></span><a class="home-link" href="./index.html" aria-label="밤의 서가 메인 화면으로 이동">← 이야기 서가</a></span></div><div class="cols"><section><figure class="scene-art" id="sceneArt" aria-label="장면 삽화"></figure><div class="tag" id="tag"></div><h1 class="title" id="title"></h1><div class="story" id="story"></div><div id="choices"></div><p><button class="reset" onclick="start()">처음부터 다시</button></p></section><aside class="side">발견한 단서<div id="clues"></div><div class="ending-head">발견한 엔딩</div><div class="ending-count" id="endingCount"></div><div id="endings"></div><div class="meter">마을의 그림자<div id="bar"></div></div></aside></div></main>
<script>
const scenes={
start:['PROLOGUE · 01','잊힌 마을의 초대','검은 종이 울리면','비가 그친 밤, 오래전 폐쇄된 안개골 마을에서 편지 한 통이 도착했다. 종이는 젖지 않았는데 봉투 가장자리에는 빗물이 맺혀 있었다.\n\n그 마을에서 나는 동생 서윤과 종소리를 세며 놀곤 했다. 함께 웃던 기억은 흐릿하지만, 서윤이 어느 날 사라졌다는 사실만 오래된 흉터처럼 남아 있다. 그 뒤로 나는 서윤의 이름을 입에 올리지 않았다.\n\n「자정에 종이 울리면, 절대 이름을 대답하지 말 것.」 발신인도 주소도 없다. 안에는 어릴 적 잃어버린 은색 단추가 들어 있다.\n\n창밖에서 종탑의 불빛이 한 번 깜박인다. 오래된 이정표 아래에는 두 갈래 길이 나 있다.',[['이정표를 따라 마을 어귀로 간다','road'],['편지의 흔적을 따라 여관으로 간다','inn']],[],0],
road:['PROLOGUE · 02','안개골 입구','돌아오지 않는 길','마을로 향하는 돌길에는 어젯밤 내린 비가 고여 있다. 내 발자국 뒤로, 나와 보폭이 똑같은 발자국 하나가 더 생긴다. 고개를 돌리면 길은 텅 비어 있다.\n\n이정표의 다른 면에는 손톱으로 긁어 쓴 글씨가 있다. 「이곳에서 이름을 말하면 마을이 기억한다.」 멀리 종탑이 보이고 길가에는 오래된 묘지가 있다.',[['종탑의 담장부터 살핀다','tower_yard'],['묘지에서 글쓴이를 찾는다','graveyard']],[],0],
inn:['PROLOGUE · 02','닫힌 여관','비어 있는 환대','여관 간판의 마지막 글자가 바람 없이 흔들린다. 창문을 들여다보자 프런트의 장부가 저절로 한 장씩 넘어간다.\n\n마지막 장에는 오늘 날짜와 내 이름, 「퇴실 완료」라는 문구가 적혀 있다. 그 아래에 다른 글씨가 나타난다. 「손님은 아직 도착하지 않았습니다.」', [['촛불을 따라 응접실로 들어간다','parlor'],['투숙 기록을 확인한다','ledger']],['투숙객 장부'],0],
tower_yard:['ACT I · 01','종탑의 담장','세 번째 울림','담장은 안쪽으로 기울어져 있다. 벽돌 틈마다 검은 깃털이 박혀 있고, 꼭대기 창문에는 누군가 서 있다. 내가 손을 들자 그 형체는 한 박자 늦게 따라 한다.\n\n문 옆에는 녹슨 사다리와 어린아이 손바닥 자국이 남아 있다.',[['사다리를 타고 안으로 들어간다','stair'],['손자국에 손을 겹친다','bell']],['아이의 손자국'],0],
graveyard:['ACT I · 01','이름 없는 묘지','비를 맞지 않는 비석','묘지의 비석들은 모두 이름이 지워져 있다. 가까이 보니 세월에 닳은 게 아니라 누군가 날카로운 도구로 일부러 긁어냈다. 긁힌 홈마다 회색 안개가 고여, 읽을 수 없는 이름을 입 모양으로 되풀이한다. 유일하게 글자가 남은 비석에는 내 생일과 같은 날짜가 새겨져 있다.\n\n작은 은빛 문장이 흙 속에 반쯤 묻혀 있다. 종이 한 번 울리고 비석의 그림자가 탑 쪽으로 길게 뻗는다.',[['은빛 문장을 챙겨 숲길을 살핀다','forest'],['빈 무덤 안을 들여다본다','shrine']],['가족의 인장'],0],
stair:['ACT I · 02','종탑 안쪽 계단','벽 안의 숨소리','탑 안은 바깥보다 따뜻하다. 돌벽 안쪽에서 누군가 천천히 숨 쉬는 소리가 들린다. 계단은 위로도 아래로도 이어진다.\n\n난간에는 어릴 적 내 필체로 보이는 글씨가 있다. 「세 번째 종이 울리기 전에 나가야 해.」', [['벽의 문양을 읽고 아래층으로 간다','runes'],['종이 있는 방으로 오른다','bell']],[],0],
bell:['ACT I · 03','종탑의 방','종 안의 아이','종은 흔들리지 않는데 방 전체가 낮게 울린다. 금속 표면에 비친 것은 현재의 내 모습이 아니라 비에 흠뻑 젖은 아이의 얼굴이다. 종 안쪽에는 지워진 이름들이 빼곡히 새겨져 있다. 긁힌 자국은 하나도 없다.\n\n아이는 입 모양으로 「언니」라고 부른다. 오래된 이름 하나가 종 표면에 떠오르며 세 번째 울림이 시작된다.',[['아이의 이름을 읽고 지하로 간다','crypt'],['종소리를 피해 숲으로 나간다','forest']],['종의 진명'],15],
runes:['ACT I · 03','벽의 문양','이름을 바치는 문','문양은 봉인 주문이다. 마지막 줄은 「문을 열 자는 이름을 내려놓을 것」. 글자를 손끝으로 따라가자 벽 안에서 작은 심장처럼 돌이 뛰기 시작한다.\n\n돌벽이 갈라지며 문이 드러난다. 틈 사이로 별빛이 쏟아지지만 내 그림자는 반대편 복도를 가리킨다.', [['주문을 완성하고 지하로 간다','crypt'],['그림자를 따라 여관의 비밀통로로 간다','inn'],['별빛으로 열린 문에 들어간다','stars']],['봉인 주문'],30],
parlor:['ACT I · 02','여관의 응접실','마지막 투숙객','탁자에는 식지 않은 차 두 잔이 놓여 있다. 벽난로 위 초상화 속 여자는 내 얼굴을 닮았다. 액자 뒤편에는 아이의 손을 놓치는 장면이 그려져 있다.\n\n복도 끝에서는 누군가 창문을 두드린다. 계단 위에서는 발소리가 멈췄다가 다시 들린다.', [['창문을 두드리는 사람을 확인한다','window'],['발소리를 따라 다락으로 올라간다','attic']],[],0],
ledger:['ACT I · 03','투숙 장부','17년 전의 퇴실','장부의 글자가 번졌다가 다시 모인다. 「서윤, 17년 전 종탑 아래에서 실종. 동행인인 언니는 구조되어 마을 밖으로 귀가.」 내가 기억하지 못하는 어린 시절의 기록이다.\n\n장부 사이에는 13호실 열쇠가 끼워져 있다. 금속이 손바닥 안에서 미세하게 떨린다.', [['열쇠로 13호실을 찾는다','room'],['장부에서 내 이름을 지우려 한다','burn']],['17년 전 기록'],0],
window:['ACT I · 03','유리창','뒤집힌 손님','창밖에는 비가 내리지 않는데 유리 안쪽으로 빗물이 흘러내린다. 그 너머의 여자가 말한다. “네가 찾는 아이는 이미 네 이름을 알고 있어.”\n\n그녀가 유리에 숫자 13을 쓴다. 숫자를 만지자 풍경이 묘지로 바뀐다. 여자는 내 손목에 은빛 자국을 남기고 사라진다.', [['숫자 13을 따라 객실로 간다','room'],['유리 너머 묘지로 들어간다','graveyard']],['유리의 숫자 13'],0],
attic:['ACT I · 04','여관의 다락','지붕 밑의 아이','다락에는 먼지가 쌓이지 않았다. 장난감들이 방금 전까지 누군가 놀다 간 듯 흩어져 있다. 지붕 밑 창문에는 마을 전체가 거꾸로 비친다.\n\n인형의 가슴을 열자 쪽지가 나온다. 「언니, 이번에는 먼저 가지 마.」 글씨는 내 것과 서윤의 것을 닮았다.', [['쪽지를 품고 13호실을 찾는다','room'],['작은 창문을 통해 숲으로 나간다','forest']],['아이의 쪽지'],0],
room:['ACT II · 01','13호실','빈 침대 두 개','방에는 작은 침대가 두 개 있다. 벽의 그림에는 두 자매가 손을 잡고 있지만 한 아이의 얼굴은 지워져 있다.\n\n침대 밑에서 편지와 은색 단추의 짝을 발견한다. 「언니가 나를 잊어도 괜찮아. 그래도 행복했으면 좋겠어.」 마지막 문장은 급히 덧붙여져 있다. 「하지만 꼭 한 번은 내 이름을 불러줘.」', [['편지를 챙겨 지하 문을 찾는다','crypt'],['벽장 뒤 계단으로 지하실에 간다','cellar']],['자매의 편지'],0],
cellar:['ACT II · 02','여관 지하실','잠겨 있는 지도','바닥에는 안개골 지도가 그려져 있다. 길은 종탑, 묘지, 사당을 지나 여관으로 돌아온다. 지도 한가운데에는 집 모양 기호와 내 손바닥 자국이 찍혀 있다. 묘지의 지워진 비석들에서 시작한 회색 선은 종탑으로 모여든다.\n\n선반의 초 하나는 검게 타 있고 다른 하나는 불을 붙이기도 전에 푸른 연기를 낸다. 지도 아래에는 작은 글씨가 새겨져 있다. 「지워진 이름이 안개가 되고, 불린 이름이 길이 된다.」', [['푸른 연기를 따라 숲으로 간다','forest'],['재가 된 장부를 더 살핀다','burn']],['지하실 지도'],0],
forest:['ACT II · 02','안개 숲','발자국의 주인','나무마다 작은 종이 매달려 있다. 바람은 없는데 종들이 하나씩 울린다. 진흙에는 두 사람의 발자국이 나란히 찍혔다가 한 쌍만 종탑 쪽으로 돌아간다.\n\n숲 가장자리 돌에 은빛 문장이 새겨져 있다. 종소리가 가까워질 때마다 문장의 선이 하나씩 환해진다.', [['은빛 문장을 들고 사당을 찾는다','shrine'],['발자국을 따라 탑 아래로 내려간다','crypt']],['가족의 인장'],0],
shrine:['ACT II · 03','숲속 사당','기억을 맡기는 곳','석상은 내 얼굴과 서윤의 얼굴을 반씩 닮았다. 은빛 문장을 얹자 서랍이 열리고 편지가 나온다. 서랍 안쪽에는 「잊힌 이름은 안개가 되어 돌아온다. 종은 기억하는 이를 위해 길을 붙든다」라는 비문이 있다. 종이에는 여관 장부에서 본 문양도 찍혀 있다.\n\n「우리가 서로를 잊어도, 집으로 돌아가는 길은 둘이서 찾자.」 아래에는 어린 두 자매의 지문이 나란히 찍혀 있다.', [['편지를 품고 기억을 마주한다','memory'],['사당에 이름을 남기고 마을 밖으로 나간다','ending_leave']],['자매의 편지','가족의 인장'],0],
burn:['ACT II · 02','잿더미','사라진 이름','장부를 태우자 글자 대신 은빛 가루가 흩날린다. 재 속에서 단추의 짝이 하나 더 나온다. 두 단추를 맞대자 오래된 가족 문장이 떠오른다.\n\n불길 뒤편의 문이 열렸다. 그 안에서 내 목소리로 속삭인다. “기록을 지우면 길도 사라져.”', [['단추를 챙겨 사당으로 간다','shrine'],['숨겨진 문을 지나 지하로 간다','crypt']],['가족의 인장'],0],
crypt:['ACT II · 03','지하의 문','뒤집힌 이름들','계단 아래에는 문이 세 개다. 하나에는 내 이름, 하나에는 서윤의 이름, 마지막에는 손바닥 자국이 새겨져 있다. 문 너머에서 물방울 소리와 아이의 콧노래가 번갈아 들린다.\n\n서윤의 이름을 읽으면 내 기억이 돌아올 것 같다. 손바닥 자국을 누르면 종탑의 진짜 모습이 드러날 것 같다.', [['서윤의 이름이 새겨진 문을 연다','memory'],['손바닥 자국이 있는 문을 연다','mirror']],['지하의 세 문'],0],
memory:['ACT II · 04','기억의 방','빗속의 약속','거울 속 어린 내가 울고 있다. 그날 밤 나와 동생 서윤은 종탑에 숨어든 뒤 길을 잃었다. 서윤은 종 안에 남아 안개가 마을 밖으로 번지지 않도록 막기로 했고, 나는 구조됐다.\n\n마을 사람들은 내가 견딜 수 있도록 서윤을 잃은 밤의 기억을 지웠다. 서윤은 내가 만들어낸 환영이 아니라, 종 안에 남아 경계를 지키는 진짜 동생이다. 서윤이 묻는다. “언니, 나를 데리러 온 거야? 아니면 언니가 괜찮아지려고 온 거야?”', [['서윤의 이름을 또렷이 부른다','ending_reunion'],['거울 뒤 봉인을 살핀다','mirror'],['모든 단서를 연결해 진실을 말한다','ending_secret',['종의 진명','자매의 편지','가족의 인장']]],['잊힌 약속'],0],
mirror:['ACT II · 05','거울의 뒷면','남겨진 사람','거울 뒤에는 오래된 봉인 장치가 있다. 마을은 서윤을 붙잡은 것이 아니라 내 기억 속 죄책감을 붙잡고 있었다.\n\n봉인을 깨면 둘 모두 풀려날 수도, 모든 기억이 사라질 수도 있다. 장치 중앙에는 검은 유리 조각이 박혀 있다. 내 손을 올리자 유리 안의 그림자가 먼저 움직인다.', [['봉인을 부수고 서윤을 놓아준다','ending_release'],['검은 유리 조각을 깨뜨린다','ending_break'],['내 기억을 대신 봉인에 바친다','ending_sacrifice']],['봉인의 구조'],0],
stars:['ENDING · V','별빛의 결말','안개 너머의 별','문 너머에는 별빛에 잠긴 마을이 있다. 지붕마다 별이 돋고 종소리는 자장가처럼 잦아든다. 이곳에 머물면 가장 슬픈 기억을 놓아줄 수 있다.\n\n하늘에 별 두 개가 나란히 떠올랐다. 하나는 서윤의 이름, 하나는 아직 기억나지 않는 누군가의 이름을 품고 있다.',[],['별이 된 마을'],0],
ending_reunion:['ENDING · I','기억의 결말','두 사람의 귀갓길','“서윤아.” 이름을 부르는 순간 종탑의 종이 멈춘다. 서윤은 오래된 꿈에서 깨어난 사람처럼 내 손을 잡는다.\n\n마을 밖으로 나가는 길은 둘이 함께 걸을 때만 나타났다. 새벽이 밝자 안개골은 사라지고, 두 자매의 손에는 같은 은색 단추가 남았다.',[],['서윤과의 재회'],0],
ending_release:['ENDING · II','해방의 결말','새벽을 건너는 아이','봉인을 부수자 안개가 강물처럼 빠져나갔다. 서윤은 자유로워졌고, 나는 그날의 모든 일을 기억하게 됐다.\n\n둘은 서로에게 사과하지 않았다. 대신 손을 잡고 해가 뜨는 쪽으로 걸어갔다.',[],['서윤의 해방'],0],
ending_break:['ENDING · III','망각의 결말','깨진 거울','검은 유리가 부서졌다. 안개골과 종탑, 유령의 목소리가 한꺼번에 사라졌다.\n\n나는 숲에서 혼자 깨어났다. 누구를 찾으러 왔는지는 기억나지 않지만, 손에는 은색 단추가 쥐어져 있다. 이제 종은 울리지 않는다.',[],['깨진 봉인'],0],
ending_sacrifice:['ENDING · IV','희생의 결말','내가 남긴 이름','내 기억을 봉인에 바치자 서윤의 모습이 또렷해졌다. 그녀는 내 이름을 불렀지만, 나는 그 이름이 누구의 것인지 알지 못했다.\n\n서윤은 마을 밖으로 나갔다. 종탑에는 내 그림자만 남아 마지막 종을 지켰다.',[],['기억의 희생'],0],
ending_leave:['ENDING · VI','미완의 결말','아직 기다리고 있어','나는 마을 밖으로 나왔다. 집에 도착한 뒤에야 주머니에서 편지를 발견한다.\n\n「언니가 날 잊어도 괜찮아. 그래도 언니가 행복했으면 좋겠어.」 편지 아래에는 내 이름이 아니라 서윤의 이름이 적혀 있다.',[],['미완의 편지'],0],
ending_secret:['ENDING · VII','진실의 결말','첫 번째 종소리','세 단서가 맞물리자, 안개와 종의 의미가 뒤집혔다. 안개는 바깥에서 온 괴물이 아니었다. 마을 사람들이 슬픔을 견디려고 지워온 이름과 기억이 뭉쳐 생긴 것이었다. 종은 서윤을 가둔 감옥이 아니라, 지워진 이름들이 완전히 사라지지 않도록 붙들어둔 그릇이었다.\n\n서윤은 내가 만들어낸 환영이 아니었다. 그날 밤 서윤은 종 안에 남아 이름들을 지키기로 선택했고, 내가 돌아와 함께 불러주기를 기다렸다. 내가 서윤과 비석의 이름들을 하나씩 부르자 안개는 걷히고, 잊힌 이들이 각자의 집으로 돌아갔다. 마지막 종소리는 두 자매의 웃음으로 바뀌었다.',[],['종의 진실'],0]
};
